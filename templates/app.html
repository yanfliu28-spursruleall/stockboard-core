<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14">
<meta name="robots" content="noindex,nofollow"><title>美股投研平台</title>
<style>
:root{--bg:#0b0f14;--panel:#131b24;--panel2:#18222d;--bd:#243040;--tx:#e8eef5;--sub:#8a9aab;--dim:#5d6b7a;--acc:#1d9bf0;--up:#3fb950;--down:#ff6b5e;--amb:#d6a01c}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--tx);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif;display:flex;min-height:100vh}
nav{width:200px;background:var(--bg);border-right:1px solid var(--bd);padding:14px 0;position:sticky;top:0;height:100vh;flex-shrink:0}
nav .brand{padding:0 16px 14px;font-weight:700}nav .brand small{display:block;color:var(--dim);font-weight:400;font-size:11px}
nav a{display:block;padding:9px 16px;color:var(--sub);cursor:pointer;border-left:3px solid transparent}nav a.on{background:#10202f;color:var(--tx);border-color:var(--acc)}
nav .grp{padding:12px 16px 4px;font-size:11px;color:var(--dim)}
main{flex:1;padding:18px 22px;min-width:0}h2{font-size:17px;margin-bottom:4px}.sub{color:var(--sub);font-size:12px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}.card b{font-size:22px;display:block}.card span{color:var(--sub);font-size:12px}.card span b{font-size:inherit;display:inline;color:var(--tx)}/*m2*/.card b span{font-size:inherit;color:inherit}.card b .up{color:var(--up)}.card b .dn{color:var(--down)}/*m3*/
.box{background:var(--panel);border:1px solid var(--bd);border-radius:10px;margin-bottom:16px;overflow:hidden}.box h3{font-size:13px;padding:10px 14px;border-bottom:1px solid var(--bd);color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;border-bottom:1px solid #1c2734;text-align:right;white-space:nowrap}
th{color:var(--sub);font-weight:500;background:var(--panel2);position:sticky;top:0;cursor:pointer}td.l,th.l{text-align:left}td.w{white-space:normal;text-align:left;min-width:180px;max-width:300px;color:#c4d0dc;font-size:12.5px}
.up{color:var(--up)}.dn{color:var(--down)}.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;border:1px solid var(--bd)}
.z-买点区{background:#10301a;color:#6ee08a}.z-沉默区{background:#1c2734;color:var(--sub)}.z-高估区{background:#3a2e0d;color:#e6b43a}.z-卖点上方{background:#3a1512;color:#ff8a7e}
.g{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;font-weight:700;font-size:12px;color:#fff;margin-right:6px}
.g-S{background:#e5484d}.g-A{background:#e8912d}.g-B{background:#3b82f6}.g-C{background:#5d6b7a}.g-D{background:#3a4654}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button,.f select,.f input{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--acc);border-color:var(--acc)}.f{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.news{padding:11px 14px;border-bottom:1px solid #1c2734}.news .t{font-weight:600;margin:3px 0}.news .m{color:var(--dim);font-size:12px}.news a{color:var(--tx);text-decoration:none}.news a:hover{color:var(--acc)}
.bar{height:6px;background:#1c2734;border-radius:3px;min-width:90px}.bar i{display:block;height:6px;border-radius:3px;background:var(--acc)}
.warn{background:#2a2410;border:1px solid #5a4a14;color:#e6c35a;padding:9px 14px;border-radius:8px;margin-bottom:14px;font-size:12.5px}
.scroll{overflow:auto;max-height:70vh}svg.sp{width:90px;height:24px}.tag{color:var(--dim);font-size:11.5px;margin-right:6px}
.mbar,.nbd{display:none}.cl{display:none}
.ch{font-size:13px;color:var(--sub);margin:12px 2px 8px;font-weight:600}.pr{border-top:1px solid #1c2734;padding:7px 0}.pn{font-size:13px;overflow-wrap:anywhere}.pm{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin-top:2px;align-items:center}
.bc{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.bh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.bz{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.b3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.b3>div{background:var(--panel2);border-radius:8px;padding:6px 8px;text-align:center}
.b3 span{display:block;color:var(--sub);font-size:11px}.b3 b{display:block;font-size:15px}.b3 em{font-style:normal;font-size:11.5px}.b3 b.hl{color:var(--amb)}
.bc details{margin-top:8px}.bc summary{cursor:pointer;color:var(--acc);font-size:13px;padding:6px 0}.sc2{max-height:46vh;overflow-y:auto}
button.go.wide{width:100%;height:38px;margin-top:8px}
@media(max-width:800px){
 body{display:block}
 .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;background:rgba(11,15,20,.94);border-bottom:1px solid var(--bd);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
 .mbar button{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:8px;width:42px;height:38px;font-size:19px;line-height:1}
 .mbar b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 nav{display:block;position:fixed;z-index:60;left:0;top:0;bottom:0;width:78vw;max-width:300px;height:auto;overflow-y:auto;transform:translateX(-104%);transition:transform .22s ease;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
 body.nav-open nav{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.65)}
 .nbd{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
 body.nav-open .nbd{opacity:1;pointer-events:auto}
 nav a{padding:14px 18px;font-size:15px}nav .grp{padding-top:16px}
 main{padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
 h2{font-size:16px}.sub{font-size:12px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:10px 12px}.card b{font-size:18px;overflow-wrap:anywhere}.card span{font-size:11.5px}
 .scroll{max-height:none;-webkit-overflow-scrolling:touch}
 .scroll table:not(.rich) td:first-child,.scroll table:not(.rich) th:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}
 .scroll table:not(.rich) th:first-child{background:var(--panel2);z-index:2}
 .fbar{gap:6px}.fbar select,.fbar input[type=text],.fbar input:not([type]){flex:1 1 130px;min-width:0}
 .fbar .tabs{width:100%}.tabs button{padding:8px 11px}
 input,select,textarea{font-size:16px}
 .ov .dr{width:100vw;padding:16px 14px calc(20px + env(safe-area-inset-bottom));border-left:0}.dr .x{right:12px;top:10px;font-size:22px;padding:6px 10px}
 .tall{display:none}.dt{display:none}.cl{display:block}
 .warn{font-size:12px;padding:8px 10px}
 .dr table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
 #inv,#clrsel,.chip:has(#nsel){display:none}
 .news{padding:10px 12px}
}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--bd);background:var(--panel);border-radius:14px;padding:3px 12px;font-size:12.5px;color:var(--sub)}.chip b{color:var(--tx)}.chip.hot{border-color:#7a2b25;color:#ff8a7e}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.fbar button,.fbar select,.fbar input{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}.fbar button.on{background:var(--acc);border-color:var(--acc)}
.tall{max-height:78vh}table.rich th,table.rich td{vertical-align:top;font-size:12.5px}
table.rich tr.grp th{background:#0f151c;color:#d6a01c;text-align:center;cursor:default;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:3}
table.rich thead tr:nth-child(2) th{top:33px;z-index:2}
td.cell{white-space:normal;text-align:left;min-width:340px;max-width:380px;padding:4px 0}.sc{max-height:190px;overflow-y:auto;scrollbar-width:thin}
.it{padding:4px 10px;font-size:12.5px;color:#c4d0dc;line-height:1.55}.rk{color:#ff8a7e}.gr{color:#6ee08a}td.hl{color:var(--amb);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;justify-content:flex-end}.dr{width:min(860px,96vw);background:var(--bg);border-left:1px solid var(--bd);overflow:auto;padding:20px 24px;position:relative}
.dr h3{font-size:13px;color:var(--sub);margin:16px 0 6px}.dr .x{position:absolute;right:16px;top:14px;background:transparent;border:0;color:var(--sub);font-size:18px;cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button.go{background:var(--panel2);color:#5cb8f7;border:1px solid var(--bd);border-radius:7px;width:30px;height:28px;cursor:pointer}
@media(max-width:800px){.two{grid-template-columns:1fr}}
</style></head><body>
<div class="mbar"><button id="mnu" aria-label="菜单">☰</button><b id="mttl">美股投研平台</b></div><div class="nbd" id="nbd"></div>
<nav><div class="brand">美股投研平台<small>US Equities · 产业研究 · 情报中台</small></div>
<div class="grp">研究面板</div><a data-v="overview" class="on">平台总览</a><a data-v="board">公司研究看板</a><a data-v="inst">机构持仓(13F)</a><a data-v="sector">行业景气度</a>
<div class="grp">信息跟踪</div><a data-v="news">重大信息跟踪</a><a data-v="brief">市场内参</a>
<div class="grp">量化研究</div><a data-v="quant">量化因子与回测</a>
<div class="grp">账户</div><a id="logout" title="清除本机保存的登录状态，下次需重新输入口令">退出登录</a></nav>
<main id="m"></main>
<script>
const D = __DATA__;
const $ = (s, r=document) => r.querySelector(s), esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (x,d=1) => x==null?'—':(x*100).toFixed(d)+'%', spct = x => x==null?'—':`<span class="${x>=0?'up':'dn'}">${x>=0?'+':''}${(x*100).toFixed(1)}%</span>`;
const money = v => v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(1)+'M':String(Math.round(v));
const fmtT = ts => new Date(ts*1000).toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const banner = `<div class="warn">${D.meta.demo?'【演示数据】':''}离线快照：数据截至 ${esc(D.meta.generated)}，非实时行情。上次更新后的变化请等待下一次自动发布。</div>`;
function spark(a){ if(!a||a.length<2) return ''; const mn=Math.min(...a),mx=Math.max(...a),w=90,h=24;
  const p=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-(v-mn)/(mx-mn+1e-9)*h).toFixed(1)}`).join(' ');
  return `<svg class="sp" viewBox="0 0 90 24"><polyline fill="none" stroke="${a.at(-1)>=a[0]?'#3fb950':'#ff6b5e'}" stroke-width="1.5" points="${p}"/></svg>`; }
const newsRow = n => `<div class="news"><span class="g g-${n.grade}">${n.grade}</span><span class="pill">${esc(n.sentiment)}</span> ${n.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}${n.tickers.map(t=>`<span class="pill">${t}</span> `).join('')}
 <div class="t"><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a></div>
 <div class="m">重要性 ${n.imp} · 强度 ${n.strength} · 确定性 ${n.certain} · 新颖度 ${n.novel} · ${esc(n.sources.join('/'))}${n.dup>1?' 等'+n.dup+'源':''} · ${fmtT(n.ts)}${n.emotional?' · 情绪化(已压分)':''}</div></div>`;

const CW = () => Math.max(300, Math.min(760, document.documentElement.clientWidth - (document.documentElement.clientWidth <= 800 ? 40 : 330)));
const V = {};
V.overview = () => { const b=D.board.filter(r=>r.price), z=k=>b.filter(r=>r.zone===k).length;
  return `<h2>平台总览</h2><div class="sub">研究面板 · 信息跟踪 · 最近重点情报</div>${banner}
  <div class="cards"><div class="card"><b>${D.board.length}</b><span>覆盖公司</span></div><div class="card"><b style="color:var(--down)">${D.alerts.filter(a=>a.level==='高').length}</b><span>高级预警</span></div>
  <div class="card"><b>${D.news.length}</b><span>情报总量</span></div><div class="card"><b style="color:var(--up)">${z('买点区')}</b><span>买点区</span></div>
  <div class="card"><b>${z('卖点上方')}</b><span>卖点上方</span></div><div class="card"><b>${D.holdings.funds.length}</b><span>跟踪机构(13F)</span></div></div>
  <div class="box"><h3>预警日报 · ${D.alerts.length} 条</h3><div class="scroll" style="max-height:260px"><table>${D.alerts.slice(0,25).map(a=>`<tr><td class="l"><b>${a.t}</b></td><td class="l">${esc(a.type)}</td><td class="l">${esc(a.level)}</td><td class="l" style="white-space:normal">${esc(a.msg)}</td></tr>`).join('')||'<tr><td>暂无预警</td></tr>'}</table></div></div>
  <div class="box"><h3>最近重点情报（S/A 级）</h3>${D.news.filter(n=>['S','A'].includes(n.grade)&&!n.excluded).slice(0,8).map(newsRow).join('')||'<div class="news">暂无</div>'}</div>`; };

let bs={f:'全部',q:'',sec:'',ind:'',alertOnly:false,k:'zoneRank',asc:true,sel:new Set()};
const ZR={'买点区':0,'沉默区':1,'高估区':2,'卖点上方':3,'无数据':4};
const f2=x=>x==null?'—':Number(x).toFixed(2), fB=v=>v==null?'—':v>=1e12?(v/1e12).toFixed(2)+'T':v>=1e9?(v/1e9).toFixed(1)+'B':(v/1e6).toFixed(0)+'M';
const items=(a,cls)=>(a||[]).map(i=>`<div class="it"><b class="${cls}">${esc(i.k)}</b> ${esc(i.t)}</div>`).join('')||'<div class="it" style="color:var(--dim)">—</div>';
const blk=(x,kind,cls)=>{ const ai=x.ai, rule=items(x[kind],cls); if(!ai) return rule; const L=kind==='risks'?ai.risks:ai.growths;
  const warn=ai.unverified>2?`<div class="it" style="color:var(--amb)">⚠ 含 ${ai.unverified} 个数字无法与事实包核对，请人工复核</div>`:'';
  return (kind==='risks'&&ai.one_liner?`<div class="it"><b>结论：</b>${esc(ai.one_liner)}</div>`:'')+`<div class="it tag">AI 推演 · 仅基于本页数据 · ${esc(ai.model)} · ${esc(ai.generated)}</div>`+warn+items(L,cls)+`<div class="it tag">—— 数据要点（规则生成）——</div>`+rule; };
const estCell=(v,e,k)=>v==='—'?v:`${v}<div class="tag">${e[k]?e[k]+'E':''}${e.ccy&&e.ccy!=='USD'?' · '+e.ccy:''}</div>`;
const ccyTag=e=>e&&e.ccy&&e.ccy!=='USD'?`<div class="tag">${e.ccy}</div>`:'';
const gen=D.meta.generated, hh=gen.slice(11,16), dd=gen.slice(0,10);
function filtered(){ let r=D.board.map(x=>({...x,zoneRank:ZR[x.zone]??4}));
  r=r.filter(x=>(bs.f==='全部'||x.zone===bs.f)&&(!bs.sec||x.gics_sector===bs.sec)&&(!bs.ind||x.gics_industry===bs.ind)&&(!bs.alertOnly||(x.alerts||[]).length)&&(!bs.q||(x.t+x.name+x.sector).toLowerCase().includes(bs.q.toLowerCase())));
  return r.sort((a,b)=>((a[bs.k]??1e9)-(b[bs.k]??1e9))*(bs.asc?1:-1)); }
V.board = () => { const secs=[...new Set(D.board.map(r=>r.gics_sector))].sort(), inds=[...new Set(D.board.filter(r=>!bs.sec||r.gics_sector===bs.sec).map(r=>r.gics_industry))].sort();
  const cnt=k=>k==='全部'?D.board.length:D.board.filter(r=>r.zone===k).length, na=D.alerts.length, h=D.meta.health||{};
  return `<div class="chips"><span class="chip">更新 <b>${dd}</b></span><span class="chip">覆盖 <b>${D.board.length}</b> 家</span>
   <span class="chip hot">每日监控 ${hh} · 预警 <b>${na}</b> 新 <b>${D.meta.new_alerts??0}</b></span>
   <span class="chip">体检 ${dd.slice(5)} · 自动估值 <b>${h.auto??'—'}</b>/${h.total??'—'} 家 · 低置信 ${h.low_conf??'—'}</span></div>
  ${banner}<div class="warn">估值 = 自身历史前瞻PE(中位)×GAAP口径一致预期EPS 与 DCF(一致预期增速) 的均值；买点/卖点带宽取自历史PE的P25/P75。一致预期来自 Yahoo 非官方接口，财报来自 SEC 10-K。无美国会计准则财报的公司仅以分析师目标价为中枢。悬停“估值来源”可看各方法结果。仅供研究参考，不构成投资建议。</div>
  <div class="fbar"><div class="tabs" style="margin:0">${['全部','买点区','沉默区','高估区','卖点上方'].map(k=>`<button data-f="${k}" class="${bs.f===k?'on':''}">${k} <b>${cnt(k)}</b></button>`).join('')}</div>
   <select id="sec"><option value="">GICS 一级: 全部</option>${secs.map(s=>`<option ${bs.sec===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
   <select id="ind"><option value="">GICS 二级: 全部</option>${inds.map(s=>`<option ${bs.ind===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
   <input id="q" placeholder="搜索公司名 / 代码 / 行业" value="${esc(bs.q)}" style="min-width:200px"><button id="clr">清空筛选</button>
   <span style="flex:1"></span><span class="chip">已选 <b id="nsel">${bs.sel.size}</b></span><button id="inv">反选</button><button id="clrsel">清除</button>
   <button id="alr" class="${bs.alertOnly?'on':''}" style="border-color:var(--down);color:#ff8a7e">预警 <b>${D.board.filter(r=>(r.alerts||[]).length).length}</b></button><span class="sub" id="shown" style="margin:0"></span></div>
  <div class="box scroll tall"><table class="rich"><thead>
   <tr class="grp"><th colspan="3">标的信息</th><th colspan="3">行业与地域</th><th colspan="2">股价 ($)</th><th colspan="3">三值 ($)</th><th colspan="2">现价位置</th><th colspan="2">结论</th><th colspan="3">核心内容（列内滚动看全文）</th><th>报告</th><th colspan="2">营收预测</th><th colspan="2">EPS预测</th></tr>
   <tr><th><input type="checkbox" id="all"></th><th>#</th><th class="l">标的（公司/代码）</th><th class="l">GICS 一级</th><th class="l">GICS 二级</th><th class="l">总部</th>
   <th data-k="price">现价</th><th data-k="since_analysis" title="估值最近一次重算时的价格与日期">分析时价</th><th data-k="buy">参考买点</th><th data-k="fair">合理价</th><th data-k="sell">参考卖点</th>
   <th data-k="to_buy">距买点</th><th data-k="to_fair">距合理价</th><th data-k="zoneRank">估值状态</th><th data-k="pe_pct" title="现价/GAAP预期EPS；括号为自身历史分位">前瞻PE(分位)</th>
   <th class="l">主要风险点</th><th class="l">主要增长点</th><th class="l">公司简介</th><th>详情</th><th title="各公司财年不同，单元格内小字为该公司自己的财年">当年E 营收</th><th>次年E 营收</th><th title="分析师一致预期，non-GAAP 口径">当年E EPS</th><th>次年E EPS</th></tr></thead><tbody id="tb"></tbody></table></div><div class="cl" id="cl"></div>`; };

  return r.map((x,i)=>{ const es=x.est||{}, up=(x.alerts||[]).length;

function bigChart(x){ const a=x.spark; if(!a||a.length<2) return ''; const W=CW(),Hh=150,all=[...a,x.buy,x.fair,x.sell], mn=Math.min(...all),mx=Math.max(...all), Y=v=>(Hh-8-(v-mn)/(mx-mn+1e-9)*(Hh-32)).toFixed(1);
  const pts=a.map((v,i)=>`${(i/(a.length-1)*W).toFixed(1)},${Y(v)}`).join(' ');
  const L=(v,c,t)=>`<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="4 4"/><text x="${W-4}" y="${Y(v)-3}" fill="${c}" font-size="11" text-anchor="end">${t} ${v}</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;background:#0f151c;border:1px solid var(--bd);border-radius:8px;margin:10px 0"><polyline fill="none" stroke="#5cb8f7" stroke-width="1.8" points="${pts}"/>${L(x.buy,'#3fb950','买点')}${L(x.fair,'#d6a01c','合理价')}${L(x.sell,'#ff6b5e','卖点')}</svg><div class="tag">近 60 个交易日收盘价与三值</div>`; }

function lineChart(dates,series,split,H=230){ const W=CW(),L=44,R=10,T=10,B=22, all=series.flatMap(s=>s.data), mn=Math.min(...all,1), mx=Math.max(...all,1), n=dates.length;
  if(n<2) return '<div class="sub">样本太短</div>';
  const X=i=>L+i/(n-1)*(W-L-R), Y=v=>T+(1-(v-mn)/(mx-mn+1e-9))*(H-T-B);
  const grid=[mn,1,mx].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===1?'#3a4654':'#1c2734'}" ${v===1?'':'stroke-dasharray="3 4"'}/><text x="${L-5}" y="${Y(v)+4}" fill="#5d6b7a" font-size="10.5" text-anchor="end">${v.toFixed(2)}</text>`).join('');
  const lines=series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||1.6}" ${s.dash?'stroke-dasharray="5 4"':''} points="${s.data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`).join('');
  const sp=split>0&&split<n?`<line x1="${X(split)}" x2="${X(split)}" y1="${T}" y2="${H-B}" stroke="#d6a01c" stroke-dasharray="4 4"/><text x="${X(split)+4}" y="${T+10}" fill="#d6a01c" font-size="10.5">样本外 →</text>`:'';
  const xl=[0,Math.floor(n/2),n-1].map(i=>`<text x="${X(i)}" y="${H-6}" fill="#5d6b7a" font-size="10.5" text-anchor="middle">${dates[i]}</text>`).join('');
  const lg=series.map(s=>`<span style="margin-right:14px;font-size:12px"><i style="display:inline-block;width:14px;height:3px;background:${s.color};vertical-align:middle;margin-right:5px"></i>${s.name}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#0f151c;border:1px solid var(--bd);border-radius:8px">${grid}${lines}${sp}${xl}</svg><div style="margin:6px 0 0">${lg}</div>`; }
function icChart(dates,ic,split){ const W=CW(),H=150,L=44,R=10,T=8,B=20,n=ic.length, m=Math.max(...ic.map(Math.abs),0.05), bw=(W-L-R)/n;
  const Y=v=>T+(1-(v+m)/(2*m))*(H-T-B), z=Y(0);
  const bars=ic.map((v,i)=>`<rect x="${(L+i*bw).toFixed(1)}" y="${Math.min(Y(v),z).toFixed(1)}" width="${Math.max(bw-1,1).toFixed(1)}" height="${Math.abs(Y(v)-z).toFixed(1)}" fill="${i<split?'#3b82f6':'#e8912d'}" opacity=".85"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#0f151c;border:1px solid var(--bd);border-radius:8px"><line x1="${L}" x2="${W-R}" y1="${z}" y2="${z}" stroke="#3a4654"/>${bars}
  <text x="${L-5}" y="${T+8}" fill="#5d6b7a" font-size="10.5" text-anchor="end">+${m.toFixed(2)}</text><text x="${L-5}" y="${H-B}" fill="#5d6b7a" font-size="10.5" text-anchor="end">-${m.toFixed(2)}</text>
  <text x="${L}" y="${H-5}" fill="#5d6b7a" font-size="10.5">${dates[0]}</text><text x="${W-R}" y="${H-5}" fill="#5d6b7a" font-size="10.5" text-anchor="end">${dates[n-1]}</text></svg>
  <div class="tag" style="margin-top:4px"><span style="color:#3b82f6">■</span> 样本内 IC  <span style="color:#e8912d">■</span> 样本外 IC（每个月一根柱：该月末因子排序与下月收益排序的相关系数）</div>`; }

/* 样本内 vs 样本外 ICIR 对比：衰减一眼可见；虚线 = 纯噪声下“搜索最优”的期望 ICIR */
function icirChart(rows,nb){ const W=CW(),rh=20,L=W<500?132:200,R=W<500?76:46,T=24,H=T+rows.length*rh+10;
  const vs=rows.flatMap(r=>[r.stats.is.icir??0,r.stats.oos.icir??0]).concat([nb,0.3,-0.3]), mx=Math.max(...vs), mn=Math.min(...vs), X=v=>L+(v-mn)/(mx-mn)*(W-L-R);

/* ================= 回测实验室：浏览器端实时重算 ================= */
const QP={};
function qDecode(){ if(QP.ok) return; const p=D.quant.pack, u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  QP.fwd=new Int16Array(u(p.fwd).buffer); QP.ok=1; }
const qRanks=r=>QP['r'+r.id]||(QP['r'+r.id]=Uint8Array.from(atob(r.ranks),c=>c.charCodeAt(0)));
function perfStat(a){ const n=a.length; if(n<6) return {ann:null,vol:null,sharpe:null,mdd:null,n};
  let c=1,pk=1,dd=0,s=0,s2=0; for(const x of a){ c*=1+x; pk=Math.max(pk,c); dd=Math.min(dd,c/pk-1); s+=x; s2+=x*x; }
  const mu=s/n, sd=Math.sqrt(Math.max(s2/n-mu*mu,0)*n/(n-1)), vol=sd*Math.sqrt(12);
  return {ann:Math.pow(c,12/n)-1,vol,sharpe:vol>0?mu*12/vol:null,mdd:dd,n}; }
const cumul=a=>{let c=1;return a.map(x=>+(c*=1+x).toFixed(4));};
function labRun(r,o){ qDecode(); const p=D.quant.pack, N=p.n, M=p.dates.length, rk=qRanks(r), fw=QP.fwd, c=o.bps/1e4, nq=o.nq;
  const O={d:[],q:Array.from({length:nq},()=>[]),top:[],bot:[],ew:[],spy:[],ls:[],lsg:[],topn:[],split:0}; let hold=null,prevT=null,prevB=null,k=0;
  for(let m=0;m<M;m++){ const b=m*N; if(p.spy[m]==null) continue; let nv=0; for(let i=0;i<N;i++) if(rk[b+i]!==255) nv++; if(nv<p.min_n) continue;
    let tT=0,tB=0,reb=(k%o.hold===0)||!hold;
    if(reb){ hold=new Int8Array(N).fill(-1); const T=new Set(),B=new Set(); for(let i=0;i<N;i++){ const v=rk[b+i]; if(v===255) continue; const g=Math.min(nq-1,Math.floor(v*nq/100)); hold[i]=g; if(g===nq-1)T.add(i); if(g===0)B.add(i); }
      const ov=(A,Z)=>Z?[...A].filter(x=>Z.has(x)).length/A.size:0; tT=prevT?1-ov(T,prevT):1; tB=prevB?1-ov(B,prevB):1; prevT=T; prevB=B; }
    const sum=new Array(nq).fill(0), cnt=new Array(nq).fill(0); let es=0,ec=0;
    for(let i=0;i<N;i++){ const f=fw[b+i]; if(f===-32768||rk[b+i]===255) continue; const x=f/1e4; es+=x; ec++; if(hold[i]>=0){ sum[hold[i]]+=x; cnt[hold[i]]++; } }
    if(ec<p.min_n) continue; const qr=sum.map((s,g)=>cnt[g]?s/cnt[g]:0);
    const topG=qr[nq-1], lsG=qr[nq-1]-qr[0], costT=reb?2*c*tT:0, costL=reb?2*c*(tT+tB):0;
    O.d.push(p.dates[m]); qr.forEach((v,g)=>O.q[g].push(v)); O.ew.push(es/ec); O.spy.push(p.spy[m]); O.top.push(topG); O.lsg.push(lsG); O.topn.push(topG-costT); O.ls.push(lsG-costL);
    if(m<p.cut) O.split++; k++; }
  return O; }

  const main=o.mode==='ls'?O.ls:O.topn, [mi,mo]=ex(main), P=perfStat(main), Pi=perfStat(mi), Po=perfStat(mo), Pe=perfStat(O.ew), Ps=perfStat(O.spy), qa=O.q.map(a=>perfStat(a).ann);

/* 遗传因子往往是同一个想法的变体：按月度 IC 序列相关性聚类，|ρ|>0.5 视为同一发现 */
function gpClusters(gp){ const corr=(a,b)=>{ const da=new Map(a.ic_dates.map((d,i)=>[d,a.ic[i]])), x=[], y=[]; b.ic_dates.forEach((d,i)=>{ if(da.has(d)){ x.push(da.get(d)); y.push(b.ic[i]); } }); if(x.length<12) return 0;
    const mx=x.reduce((s,v)=>s+v,0)/x.length, my=y.reduce((s,v)=>s+v,0)/y.length; let sxy=0,sxx=0,syy=0; for(let i=0;i<x.length;i++){ sxy+=(x[i]-mx)*(y[i]-my); sxx+=(x[i]-mx)**2; syy+=(y[i]-my)**2; } return sxy/Math.sqrt(sxx*syy+1e-12); };
  const cl=[]; gp.forEach(r=>{ const c=cl.find(g=>Math.abs(corr(g[0],r))>0.5); c?c.push(r):cl.push([r]); }); return cl; }

  <div class="it" style="padding:4px 0"><b>机制：</b>${esc(r.mech)}</div>${r.expr?`<div class="it" style="padding:4px 0"><b>公式：</b><code style="color:#e6b43a">${esc(r.expr)}</code></div>`:''}
  ${r.members?`<div class="it" style="padding:4px 0"><b>成员：</b>${r.members.map(esc).join('、')}</div>`:''}
  <div class="cards" style="margin-top:10px">${card(icc(s.all.ic),'IC 均值（全）')}${card(n2(s.is.icir)+' → '+n2(s.oos.icir),'ICIR 样本内 → 样本外')}${card(n2(s.oos.t,1),'样本外 t 值')}${card(pc(s.oos.hit,0),'样本外 IC>0 月份占比')}${card(n2(nu.is_icir)+' → '+n2(nu.oos_icir),'行业中性 ICIR 内 → 外')}${card(n2(r.bt.monotonic),'分位单调性')}</div>
  <div class="tag" style="margin:2px 0 8px">${shrink}</div>
  ${labCtl()}<div id="lab">${labView(r)}</div>
  <h3 style="font-size:13px;color:var(--sub);margin:14px 0 6px">月度 IC 序列</h3>${icChart(r.ic_dates,r.ic,r.ic_split)}
  <div class="two" style="margin-top:14px"><div><h3 style="font-size:13px;color:var(--sub);margin:0 0 6px">分行情（月末 SPY 相对 200 日线）</h3><table><tr><td class="l">牛市 (${r.regime.n_bull} 月)</td><td>${icc(r.regime.bull)}</td></tr><tr><td class="l">熊/震荡 (${r.regime.n_bear} 月)</td><td>${icc(r.regime.bear)}</td></tr></table>
   <div class="tag" style="margin-top:6px">两种环境下符号相反 = 因子只在特定环境有效，不是稳定的规律。</div></div>
   <div><h3 style="font-size:13px;color:var(--sub);margin:0 0 6px">当前横截面（${D.quant.meta.end}，蓝色=在你的覆盖名单中）</h3><table><tr><td class="l up">最高分</td><td class="l" style="white-space:normal">${r.top.map(x=>nm(x[0])).join(' ')}</td></tr><tr><td class="l dn">最低分</td><td class="l" style="white-space:normal">${r.bottom.map(x=>nm(x[0])).join(' ')}</td></tr></table></div></div></div>`; }
function bindQuant(){ document.querySelectorAll('[data-qf]').forEach(b=>b.onclick=()=>{qs.fam=b.dataset.qf;show('quant')});
  const sr=document.getElementById('qsrc'); if(sr) sr.onchange=e=>{qs.src=e.target.value;show('quant')};
  document.querySelectorAll('[data-qk]').forEach(h=>h.onclick=()=>{qs.asc=qs.k===h.dataset.qk?!qs.asc:false;qs.k=h.dataset.qk;show('quant')});
  document.querySelectorAll('.qr').forEach(tr=>tr.onclick=()=>{qs.sel=tr.dataset.id;show('quant');document.getElementById('qd')?.scrollIntoView({behavior:'smooth'})});
  const upd=()=>{ const r=qRows().find(x=>x.id===qs.sel); if(r) document.getElementById('lab').innerHTML=labView(r); };
  [['lab-nq','nq'],['lab-hold','hold'],['lab-mode','mode']].forEach(([id,k])=>{ const e=document.getElementById(id); if(e) e.onchange=()=>{ qs.lab[k]=k==='mode'?e.value:+e.value; upd(); }; });
  const b=document.getElementById('lab-bps'); if(b) b.oninput=()=>{ qs.lab.bps=+b.value; document.getElementById('lab-bpsv').textContent=b.value; upd(); }; }

function show(v){ if(!V[v]) v='overview'; const switched=window._cv!==v; window._cv=v;
  document.querySelectorAll('nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const cur=document.querySelector('nav a[data-v="'+v+'"]'); if(cur) document.getElementById('mttl').textContent=cur.textContent;
  document.body.classList.remove('nav-open'); $('#m').innerHTML=V[v](); bind(v);
  if(switched){ window.scrollTo(0,0); try{ history.replaceState(null,'','#'+v); }catch(e){} } }
function bind(v){ if(v==='board'){ const upd=()=>{ $('#tb').innerHTML=rowsBoard(); $('#cl').innerHTML=cardsBoard(); $('#shown').textContent=`显示 ${filtered().length} / ${D.board.length} 家`; $('#nsel').textContent=bs.sel.size; bindRows(); };
    document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{bs.f=b.dataset.f;show('board')});
    $('#sec').onchange=e=>{bs.sec=e.target.value;bs.ind='';show('board')}; $('#ind').onchange=e=>{bs.ind=e.target.value;show('board')};
    $('#q').oninput=e=>{bs.q=e.target.value;upd()}; $('#clr').onclick=()=>{bs.f='全部';bs.q='';bs.sec='';bs.ind='';bs.alertOnly=false;show('board')};
    $('#alr').onclick=()=>{bs.alertOnly=!bs.alertOnly;show('board')};
    $('#inv').onclick=()=>{filtered().forEach(x=>bs.sel.has(x.t)?bs.sel.delete(x.t):bs.sel.add(x.t));upd()}; $('#clrsel').onclick=()=>{bs.sel.clear();upd()};
    $('#all').onchange=e=>{filtered().forEach(x=>e.target.checked?bs.sel.add(x.t):bs.sel.delete(x.t));upd()};
    document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{bs.asc=bs.k===th.dataset.k?!bs.asc:true;bs.k=th.dataset.k;show('board')});
    function bindRows(){ document.querySelectorAll('.ck').forEach(c=>c.onchange=()=>{c.checked?bs.sel.add(c.dataset.t):bs.sel.delete(c.dataset.t);$('#nsel').textContent=bs.sel.size});
      document.querySelectorAll('.go').forEach(g=>g.onclick=()=>openDetail(g.dataset.t)); }
    upd(); }
  if(v==='quant') bindQuant();
  if(v==='news'){ document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ns.g=b.dataset.g;show('news')}); $('#nq').oninput=e=>{ns.q=e.target.value;$('.box').innerHTML=newsList()}; } }
document.querySelectorAll('nav a[data-v]').forEach(a=>a.onclick=()=>show(a.dataset.v)); (function(){ const h=location.hash.slice(1), [v,arg]=h.split('/');
  document.getElementById('mnu').onclick=()=>document.body.classList.toggle('nav-open');
  document.getElementById('nbd').onclick=()=>document.body.classList.remove('nav-open');
  show(V[v]?v:'overview');
  if(h==='nav') document.body.classList.add('nav-open');
  if(arg){ if(v==='board') openDetail(arg); else if(v==='quant'){ qs.sel=arg; show('quant'); } }
  let lw=document.documentElement.clientWidth, tm;
  addEventListener('resize',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const w=document.documentElement.clientWidth; if(Math.abs(w-lw)>30){ lw=w; show(window._cv); } },250); });
})();
document.getElementById('logout').onclick=()=>{try{sessionStorage.removeItem('usboard_k1');localStorage.removeItem('usboard_k1');}catch(e){} location.reload();};
</script></body></html>
